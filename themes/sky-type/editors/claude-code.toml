# Claude Code CLI 사용자 정의 테마 색. 터미널 배경·ANSI 팔레트는 터미널 앱에서 관리.
[colors] # 오른쪽은 양쪽 모드에 존재하는 공통 roles 이름. 생략하면 기본 매핑 유지.
# claude = "accent" # assistant 라벨·spinner의 주 강조색.
# text = "text" # 기본 본문 글자색.
# inactive = "muted" # 안내·시간·보조 글자색.
# promptBorder = "focus" # 입력란 테두리색.
# planMode = "function" # 계획 모드 강조색.
# userMessageBackground = "surface" # 사용자 메시지 배경색.
# selectionBg = "selection_background" # 전체 화면 모드 마우스 선택 배경색.
