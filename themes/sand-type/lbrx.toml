# LBRX Sand Petrol: 글꼴, 모드별 색상 팔레트, 역할, 터미널 ANSI 슬롯.
# 샌드와 페트롤 블루의 차분한 종이·서재 배색. ANSI·오류·경고·성공의 의미는 유지한다.
# 팔레트 또는 역할 키를 추가할 때는 라이트·다크 양쪽에 둔다.
schema_version = 1 # 원본 형식 버전. 현재는 1만 지원.

[typography.prose] # 본문용 글꼴
families = ["LINE Seed Sans", "LINE Seed Sans KR", "LINE Seed JP_TTF", "sans-serif"] # 왼쪽부터 글리프 폴백, 마지막은 일반 글꼴 계열.
size_px = 16 # 본문 글자 크기(px).
line_height = 1.65 # 본문 줄 높이. 글자 크기에 곱하는 배율(단위 없음).

[typography.mono] # 코드·고정폭 글꼴
families = ["D2Coding ligature", "monospace"] # 코드 글꼴 우선순위. 마지막은 일반 고정폭 계열.
size_px = 14 # 코드 글자 크기(px). 일부 앱은 다른 단위로 변환.
line_height = 1.45 # 코드 줄 높이. 글자 크기에 곱하는 배율(단위 없음).

[light.palette] # 라이트 실제 색상. 각 값은 #RRGGBB 문자열.
accent = "#286B73" # 스타일 주 강조·링크·포커스 색(불투명 sRGB #RRGGBB).
paper = "#F8F4EB" # 문서·편집기·터미널 기본 배경(불투명 sRGB #RRGGBB).
ink = "#343830" # 본문·편집기·터미널 기본 글자색(불투명 sRGB #RRGGBB).
pine = "#246958" # 성공 상태·ANSI 초록의 의미색. UI 강조와 분리.
muted = "#5E6153" # 보조 글자·주석·줄 번호 색(불투명 sRGB #RRGGBB).
slate = "#865B34" # 스타일 보조 강조·문자열 색(불투명 sRGB #RRGGBB).
plum = "#286B73" # 키워드·인라인 코드 색(불투명 sRGB #RRGGBB).
ochre = "#815919" # 숫자·경고 등에 쓰는 황토색.
clay = "#A44540" # 오류 등에 쓰는 적갈색.
surface = "#EDE7D9" # 패널·사이드바·코드 블록 배경(불투명 sRGB #RRGGBB).
syntax_declaration = "#286B73" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_escape = "#865B34" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_builtin = "#795814" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_macro = "#286B73" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_type = "#865B34" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_parameter = "#865B34" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_property = "#865B34" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_operator = "#5E6153" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_attribute = "#865B34" # 구문 토큰 색(불투명 sRGB #RRGGBB).
syntax_punctuation = "#5E6153" # 구문 토큰 색(불투명 sRGB #RRGGBB).
selection = "#D3E3E0" # 코드·UI 선택 배경(불투명 sRGB #RRGGBB).
prose_selection = "#EADCC5" # 일반 본문 선택 배경(불투명 sRGB #RRGGBB).
ansi_blue = "#245E8A" # ANSI 4 파랑 전경. 스타일 보조 강조와 분리.
ansi_magenta = "#805074" # ANSI 5 마젠타 전경. 스타일 키워드와 분리.
ansi_black = "#343830" # 터미널 ANSI 전경색(불투명 sRGB #RRGGBB).
ansi_cyan = "#28646A" # 일반 ANSI 시안.
ansi_white = "#5E6153" # 터미널 ANSI 전경색(불투명 sRGB #RRGGBB).
ansi_bright_black = "#5E6153" # 터미널 ANSI 전경색(불투명 sRGB #RRGGBB).
ansi_bright_red = "#B44C3B" # ANSI 9 빨강. 기본 배경 대비 4.5:1 이상.
ansi_bright_green = "#39734D" # ANSI 10 초록. 기본 배경 대비 4.5:1 이상.
ansi_bright_yellow = "#876419" # ANSI 11 노랑. 라이트에서는 황토색으로 대비 확보.
ansi_bright_blue = "#3274A5" # ANSI 12 파랑. 기본 배경 대비 4.5:1 이상.
ansi_bright_magenta = "#8F5E85" # ANSI 13 마젠타. 기본 배경 대비 4.5:1 이상.
ansi_bright_cyan = "#307889" # ANSI 14 시안. 기본 배경 대비 4.5:1 이상.
ansi_bright_white = "#343830" # 터미널 ANSI 전경색(불투명 sRGB #RRGGBB).

