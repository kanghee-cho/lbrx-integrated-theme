# "list.activeSelectionForeground" = "selection_text"
# "list.inactiveSelectionBackground" = "surface"
# "list.inactiveSelectionForeground" = "text"
# "list.hoverBackground" = "selection_background"
# "sideBarSectionHeader.background" = "surface"
# "sideBarSectionHeader.foreground" = "muted"

# 상태줄 (디버깅 / 열린 폴더 없음)
