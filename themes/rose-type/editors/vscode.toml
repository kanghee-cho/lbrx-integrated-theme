# LBRX Rose Slate: 이 파일의 앱 전용 설정. 공통 색은 ../lbrx.toml 참조.
# VS Code 작업 화면 색상 전용. 값은 lbrx.toml의 라이트·다크 roles 이름.
# 키를 생략하면 어댑터 기본 매핑을 사용한다.
[colors]
"editorCursor.foreground" = "focus" # 코드 편집기의 커서색.
"sideBar.background" = "surface" # 탐색기 등이 있는 사이드바의 배경색.

# 탭
