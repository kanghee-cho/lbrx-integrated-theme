# LBRX Lavender Mint: 이 파일의 앱 전용 설정. 공통 색은 ../lbrx.toml 참조.
# Vim 하이라이트 그룹 전용. 값은 lbrx.toml의 라이트·다크 roles 이름.
# 키를 생략하면 어댑터 기본 매핑을 사용한다.
[colors]
LineNr = "muted" # 줄 번호의 글자색.
# Comment = "muted" # 예시: Vim 공통 주석 그룹의 글자색. 언어 전용 그룹이 있으면 해당 그룹이 우선.

[highlights]
# 아래 행은 주석을 해제한 그룹만 적용한다. fg/bg/sp는 공통 역할 이름 또는 "none".
# styles는 bold, italic, underline, undercurl, reverse, strikethrough 중 선택. []는 스타일 제거.

# 편집 화면
# ColorColumn = { bg = "surface" } # 세로 가이드.
# Conceal = { fg = "muted", bg = "none" } # 숨김 구문의 대체 문자.
# lCursor = { fg = "background", bg = "focus" } # 언어 매핑 커서.
# CursorIM = { fg = "background", bg = "focus" } # IME 커서.
# CursorColumn = { bg = "surface" } # 현재 커서 열.
# EndOfBuffer = { fg = "muted" } # 파일 끝의 ~ 표시.
# VertSplit = { fg = "muted", bg = "background" } # 세로 분할 경계.
# Folded = { fg = "muted", bg = "surface", styles = ["italic"] } # 접힌 줄.
# FoldColumn = { fg = "muted", bg = "surface" } # 접기 열.
# LineNrAbove = { fg = "muted" } # 상대 줄 번호: 위쪽.
# LineNrBelow = { fg = "muted" } # 상대 줄 번호: 아래쪽.
# NonText = { fg = "muted" } # 문서 내용이 아닌 표시 문자.
# SpecialKey = { fg = "muted" } # 공백·탭 등의 표시 문자.
# Terminal = { fg = "text", bg = "background" } # 내장 터미널 창의 기본 그룹.
# VisualNOS = { fg = "selection_text", bg = "selection_background" } # 선택권이 없는 Visual 표시.

# 탐색 UI
# Directory = { fg = "focus", styles = ["bold"] } # 디렉터리 이름.
# QuickFixLine = { fg = "selection_text", bg = "selection_background" } # 현재 Quickfix 항목.
# TabLine = { fg = "muted", bg = "surface" } # 비활성 탭.
# TabLineFill = { fg = "muted", bg = "background" } # 탭 표시줄의 빈 부분.
# TabLineSel = { fg = "selection_text", bg = "selection_background", styles = ["bold"] }
# WildMenu = { fg = "selection_text", bg = "selection_background", styles = ["bold"] }

# 메시지 UI
# MessageWindow = { fg = "text", bg = "surface" } # 메시지 팝업.
# ModeMsg = { fg = "focus", styles = ["bold"] } # INSERT 등 현재 모드 메시지.
# MoreMsg = { fg = "focus", styles = ["bold"] } # 메시지 더 보기.
# PopupNotification = { fg = "text", bg = "surface" } # 알림 팝업.
# Question = { fg = "focus", styles = ["bold"] } # 확인 질문.
# Title = { fg = "heading", styles = ["bold"] } # 목록·출력 제목.

# 맞춤법 — 구문색은 두고 밑줄만 지정. 밑줄 색과 모양은 터미널 지원에 따름.
# SpellBad = { sp = "error", styles = ["undercurl"] }
# SpellCap = { sp = "warning", styles = ["undercurl"] }
# SpellLocal = { sp = "link", styles = ["undercurl"] }
# SpellRare = { sp = "syntax_macro", styles = ["undercurl"] }

# 상태줄 확장 — 기존 statusline 포맷의 %1* ~ %9*에서 사용.
# User1 = { fg = "text", bg = "surface" }
# User2 = { fg = "focus", bg = "surface", styles = ["bold"] }
# User3 = { fg = "muted", bg = "surface" }
# User4 = { fg = "warning", bg = "surface" }
# User5 = { fg = "error", bg = "surface" }
# User6 = { fg = "success", bg = "surface" }
# User7 = { fg = "link", bg = "surface" }
# User8 = { fg = "text", bg = "background" }
# User9 = { fg = "selection_text", bg = "selection_background" }
