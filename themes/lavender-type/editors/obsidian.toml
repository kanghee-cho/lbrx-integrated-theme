# LBRX Lavender Mint: 이 파일의 앱 전용 설정. 공통 색은 ../lbrx.toml 참조.
# Obsidian 테마 CSS 설정. 색과 본문·코드 블록 조판을 조정한다.
# 변경 예시는 기존 활성 줄을 교체할 때 사용한다. 같은 키를 두 번 선언하지 않는다.
[prose] # D03: 읽기 뷰·라이브 프리뷰의 일반 본문. 글자 크기는 Obsidian 설정 유지.
use_shared_line_height = true # 합의한 기본값: lbrx.toml의 typography.prose.line_height 사용(배율, 현재 1.65).
# use_shared_line_height = false # Obsidian 기본 줄 높이를 사용한다. 키를 생략해도 동일하다.
# 배율 자체를 변경하려면 lbrx.toml의 [typography.prose]에서 line_height를 수정한다. 이 공통값을 쓰는 다른 앱에도 반영된다.

[code] # D04·D19: 여러 줄 코드 블록의 줄 높이와 읽기 뷰 표시. 글자 크기는 앱 설정 유지.
use_shared_line_height = true # lbrx.toml의 typography.mono.line_height 사용(배율, 현재 1.45).
# use_shared_line_height = false # Obsidian 기본 코드 블록 줄 높이를 사용한다. 키를 생략해도 동일하다.
# 배율 자체를 변경하려면 lbrx.toml의 [typography.mono]에서 line_height를 수정한다. 이 공통값을 쓰는 다른 앱에도 반영된다.
reading_border_width_px = 1 # 읽기 뷰의 코드 블록 테두리 두께(px). 색은 보조 텍스트색(--text-muted). 생략하면 기존 테두리 유지.
# reading_border_width_px = 0 # 변경 예시: 읽기 뷰 코드 블록의 테두리 숨김(px). 위 줄을 대체.
reading_horizontal_scroll = true # 읽기 뷰에서 긴 코드 줄을 줄바꿈하지 않고 필요할 때 가로 스크롤.
# reading_horizontal_scroll = false # 기존 줄바꿈·스크롤 동작 유지. 위 줄을 대체하거나 키를 생략.

[layout] # D05: 읽기 뷰·라이브 프리뷰 본문 폭과 좌우 여백. 표 전체를 생략하면 앱 기본값.
max_width_px = 860 # '읽기 편한 줄 길이'를 켰을 때의 좌우 여백 포함 최대 폭(px).
# max_width_px = 960 # 넓은 본문을 선호할 때의 최대 폭(px).
padding_inline_min_px = 16 # 양쪽 각각의 최소 안쪽 여백(px). 중간 구간은 창 너비의 4%.
# padding_inline_min_px = 12 # 좁은 창에서 양쪽 여백을 줄이는 예시(px).
padding_inline_max_px = 32 # 양쪽 각각의 최대 안쪽 여백(px).
# padding_inline_max_px = 40 # 넓은 창에서 양쪽 여백을 늘리는 예시(px).

[paragraph] # D06–D07: 읽기 뷰의 최상위 일반 문단. 키를 생략하면 해당 앱 기본값 유지.
gap_px = 12 # 연속 문단 사이 간격(px). 라이브 프리뷰와 원문의 빈 줄은 그대로 유지.
# gap_px = 8 # 문단을 더 촘촘하게 배치하는 예시(px).
# gap_px = 16 # 문단을 더 여유 있게 배치하는 예시(px).
# gap_px = 0 # 연속 문단 사이에 추가 여백을 두지 않는 예시(px).
alignment = "start" # 글이 시작되는 쪽으로 정렬(LTR은 왼쪽, RTL은 오른쪽). 방향 자체는 바꾸지 않음.
# alignment = "justify" # 문단을 양쪽 정렬하는 예시. 키를 생략하면 앱 기본 정렬.

# [prose_detail] # D08: 읽기 뷰의 최상위 일반 문단. 인라인 코드가 있는 문단은 제외하며, 기본값은 앱에 맡긴다.
# letter_spacing_em = 0.025 # 자간(em, -0.5~0.5). 음수는 좁게, 양수는 넓게.
# common_ligatures = false # 일반 합자 사용 여부. true로 바꾸면 활성화.
# small_caps = true # 작은 대문자로 표시. false는 일반 대소문자 표시.
# text_transform = "none" # 화면의 대소문자 변환: none, capitalize, uppercase, lowercase. 원문은 수정하지 않는다.

# D10: H1–H6 크기·굵기는 두 뷰에서, 위아래 여백·구분선은 읽기 뷰에서만 적용한다.
# headings 전체를 생략하면 앱 기본 조판을 사용한다. 노트의 인라인 제목은 제외한다.
[headings.h1]
size_percent = 180 # 본문 크기 대비 제목 크기(%).
# size_percent = 170 # H1을 조금 작게 조정하는 예시(%).
weight = 700 # 제목 굵기(CSS font-weight, 1–1000).
# weight = 650 # H1 굵기를 줄이는 예시.
margin_before_px = 32 # 제목 위 바깥 여백(px).
# margin_before_px = 28 # H1 위 여백을 줄이는 예시(px).
margin_after_px = 16 # 제목 아래 바깥 여백(px).
# margin_after_px = 12 # H1 아래 여백을 줄이는 예시(px).
divider = true # 제목 아래에 보조 글자색으로 1px 구분선을 추가한다.
# divider = false # 이 단계에 구분선을 추가하지 않는다.

[headings.h2]
size_percent = 150 # 본문 대비 크기(%).
weight = 700 # 제목 굵기(CSS font-weight, 1–1000).
margin_before_px = 28 # 제목 위 바깥 여백(px).
margin_after_px = 12 # 제목 아래 바깥 여백(px).
divider = false # 이 단계에 구분선을 추가하지 않는다. true로 바꾸면 1px 구분선 추가.

[headings.h3]
size_percent = 130 # 본문 대비 크기(%).
weight = 600 # 제목 굵기(CSS font-weight, 1–1000).
margin_before_px = 24 # 제목 위 바깥 여백(px).
margin_after_px = 10 # 제목 아래 바깥 여백(px).
divider = false # 이 단계에 구분선을 추가하지 않는다. true로 바꾸면 1px 구분선 추가.

[headings.h4]
size_percent = 115 # 본문 대비 크기(%).
weight = 600 # 제목 굵기(CSS font-weight, 1–1000).
margin_before_px = 20 # 제목 위 바깥 여백(px).
margin_after_px = 8 # 제목 아래 바깥 여백(px).
divider = false # 이 단계에 구분선을 추가하지 않는다. true로 바꾸면 1px 구분선 추가.

[headings.h5]
size_percent = 105 # 본문 대비 크기(%).
weight = 600 # 제목 굵기(CSS font-weight, 1–1000).
margin_before_px = 16 # 제목 위 바깥 여백(px).
margin_after_px = 8 # 제목 아래 바깥 여백(px).
divider = false # 이 단계에 구분선을 추가하지 않는다. true로 바꾸면 1px 구분선 추가.

[headings.h6]
size_percent = 100 # 본문 대비 크기(%).
weight = 600 # 제목 굵기(CSS font-weight, 1–1000).
margin_before_px = 16 # 제목 위 바깥 여백(px).
margin_after_px = 8 # 제목 아래 바깥 여백(px).
divider = false # 이 단계에 구분선을 추가하지 않는다. true로 바꾸면 1px 구분선 추가.

# D11: 제목에 자동 번호를 붙이지 않는다. Markdown에 직접 쓴 번호와 개요는 그대로 유지한다.

[links] # D12–D13: 내부·외부 링크의 밑줄과 키보드 포커스. 키를 생략하면 앱 설정 사용.
internal_underline = true # 일반 내부 링크에 밑줄 표시.
# internal_underline = false # 일반 내부 링크 밑줄 끄기.
internal_hover_underline = true # 내부 링크에 마우스를 올렸을 때 밑줄 표시.
# internal_hover_underline = false # 내부 링크의 호버 밑줄 끄기.
external_underline = true # 일반 외부 링크에 밑줄 표시.
# external_underline = false # 일반 외부 링크 밑줄 끄기.
external_hover_underline = true # 외부 링크에 마우스를 올렸을 때 밑줄 표시.
# external_hover_underline = false # 외부 링크의 호버 밑줄 끄기.
keyboard_focus_outline = true # 읽기 뷰의 키보드 포커스에 공통 focus 색 2px 윤곽선과 2px 간격 적용.
# keyboard_focus_outline = false # 테마 윤곽선을 추가하지 않고 앱 기본 포커스 표시 유지.

[blockquote] # D14: 읽기 뷰의 일반·중첩 인용문. 각 키를 생략하면 해당 항목의 앱 기본값 유지.
text_role = "quote" # 인용문 글자색. lbrx.toml의 각 모드 roles 이름.
# text_role = "text" # 변경 예시: 인용문 글자를 일반 본문과 같은 색으로 표시.
border_role = "quote" # 시작 방향 실선의 색. lbrx.toml의 각 모드 roles 이름.
# border_role = "muted" # 변경 예시: 시작 방향 실선에 보조 글자색 사용.
border_width_px = 3 # 시작 방향 실선의 두께(px).
# border_width_px = 0 # 변경 예시: 시작 방향 실선을 숨김(px).
padding_start_em = 0.9 # 시작 방향 안쪽 여백(인용문 글자 크기 기준 em).
# padding_start_em = 0.6 # 변경 예시: 시작 방향 안쪽 여백을 줄임(em).

[colors]
# 값은 lbrx.toml의 라이트·다크 roles 이름. 키를 생략하면 어댑터 기본 매핑을 사용한다.
# D15: 읽기 뷰·라이브 프리뷰의 인라인 코드 글자색만 설정. 생략하면 기존 Obsidian 표시 유지.
"--lbrx-inline-code-color" = "inline_code" # 공통 인라인 코드 역할색. 코드 배경과 최소 4.5:1 대비 필요.
# "--lbrx-inline-code-color" = "text" # 변경 예시: 인라인 코드를 일반 본문과 같은 색으로 표시.
# "--link-color" = "function" # 일반 내부 링크의 글자색. 생략하면 공통 link.
# "--link-color-hover" = "accent" # 내부 링크 호버 색. 생략하면 앱의 호버 색.
"--link-external-color" = "link" # 외부 링크의 글자색. 내부 노트 링크와는 별개.
# "--link-external-color" = "function" # 변경 예시: 외부 링크에 함수 역할색을 사용한다.
# "--link-external-color-hover" = "accent" # 외부 링크 호버 색. 생략하면 앱의 호버 색.
"--text-muted" = "muted" # 보조 텍스트의 글자색.
# "--text-muted" = "text" # 변경 예시: 보조 텍스트에 본문과 같은 글자색을 사용한다.
# D09: H1–H6의 기본색은 모두 공통 heading. 각 줄을 켜면 해당 단계의 색만 바뀐다.
# "--h1-color" = "accent" # H1 제목에 강조색 사용.
# "--h2-color" = "accent" # H2 제목에 강조색 사용.
# "--h3-color" = "accent" # H3 제목에 강조색 사용.
# "--h4-color" = "accent" # H4 제목에 강조색 사용.
# "--h5-color" = "accent" # H5 제목에 강조색 사용.
# "--h6-color" = "accent" # H6 제목에 강조색 사용.
# "--inline-title-color" = "heading" # 노트 이름으로 표시되는 인라인 제목에 공통 제목색 사용. 생략하면 앱 기본색.
# "--lbrx-footnote-reference" = "link" # D18: [footnotes] 사용 시 각주 참조 번호에 공통 링크 역할색 사용. 생략하면 function.

[live_preview] # O02: 포커스를 받은 라이브 프리뷰의 편집 표시. 읽기 뷰와 소스 모드는 제외.
highlight_active_line = true # 활성 줄에 공통 surface 역할을 60% 불투명도의 배경으로 겹쳐 표시.
# highlight_active_line = false # 변경 예시: 활성 줄은 기존 표시 유지. 위 줄을 대체하거나 키를 생략.
use_focus_caret = true # 텍스트 입력 커서에 공통 focus 역할색 적용.
# use_focus_caret = false # 변경 예시: 입력 커서는 기존 색 유지. 위 줄을 대체하거나 키를 생략.

[source_mode] # O03: Markdown 소스 모드의 편집 기호. 읽기 뷰와 라이브 프리뷰는 제외.
mute_markdown_markers = true # 앱이 Markdown 기호로 식별한 요소에 보조 텍스트색(--text-muted) 적용. 코드 블록·YAML 속성 영역은 제외.
# mute_markdown_markers = false # 기호는 기존 색을 유지. 위 줄을 대체하거나 키를 생략.

[internal_links] # O04: 읽기 뷰·라이브 프리뷰의 미생성 링크와 노트 임베드. 소스 모드는 제외.
distinguish_unresolved = true # 미생성 내부 링크에 보조 텍스트색(--text-muted)과 점선 밑줄 적용. 앱의 흐림 효과는 해제.
# distinguish_unresolved = false # 변경 예시: 미생성 링크를 기존 스타일로 표시. 위 줄을 대체하거나 키를 생략.
note_embed_border_width_px = 2 # 노트 임베드의 시작 방향 강조선 두께(px). 색은 앱의 테마 강조색(--interactive-accent).
# note_embed_border_width_px = 0 # 변경 예시: 시작 방향 강조선을 숨김(px). 키를 생략하면 기존 테두리 유지.

[tags_and_properties] # O05: 읽기 뷰·라이브 프리뷰의 본문 태그와 노트 속성. YAML 원문·사이드바는 제외.
style_inline_tags = true # 본문 태그에 공통 surface 배경과 테마 accent 글자색 적용.
# style_inline_tags = false # 기존 태그 색을 유지. 위 줄을 대체하거나 키를 생략.
style_properties = true # 노트 속성 이름에 보조 텍스트색, 편집 포커스에 공통 focus 색 2px 테두리 적용.
# style_properties = false # 기존 속성 이름색과 포커스 표시를 유지. 위 줄을 대체하거나 키를 생략.

[navigation_sidebar] # O06: 사이드바 탐색 행의 호버·현재/선택·키보드 포커스 표시. 본문과 다른 패널은 제외.
file_explorer = true # 파일 탐색기에 공통 accent 혼합 배경과 focus 윤곽선 적용.
# file_explorer = false # 파일 탐색기는 기존 스타일 유지. 위 줄을 대체하거나 키를 생략.
outline = true # 개요에 공통 accent 혼합 배경과 focus 윤곽선 적용.
# outline = false # 개요는 기존 스타일 유지. 위 줄을 대체하거나 키를 생략.
backlinks = true # 백링크 패널 결과에 공통 accent 혼합 배경과 focus 윤곽선 적용.
# backlinks = false # 백링크 패널은 기존 스타일 유지. 위 줄을 대체하거나 키를 생략.

[workspace] # O07: 작업 공간의 탭·리본·상태 표시줄·분할 경계. 크기와 조작 방식은 변경하지 않음.
style_active_tabs = true # 활성 탭에 surface 배경, accent 색의 2px 아래 표시선, 굵은 제목을 적용.
# style_active_tabs = false # 활성 탭은 기존 표시 유지. 위 줄을 대체하거나 키를 생략.
shade_ribbon = true # 리본이 접혔을 때도 공통 surface 배경을 적용.
# shade_ribbon = false # 리본의 기존 배경을 유지. 위 줄을 대체하거나 키를 생략.
shade_status_bar = true # 상태 표시줄에 공통 surface 배경을 적용.
# shade_status_bar = false # 상태 표시줄의 기존 배경을 유지. 위 줄을 대체하거나 키를 생략.
style_split_dividers = true # 분할 경계에 surface와 보조 텍스트색(24%)을 섞은 색을 적용.
# style_split_dividers = false # 분할 경계의 기존 색을 유지. 위 줄을 대체하거나 키를 생략.

