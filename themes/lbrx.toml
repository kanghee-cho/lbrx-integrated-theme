schema_version = 1

[typography.prose]
families = ["LINE Seed Sans", "LINE Seed Sans KR", "LINE Seed JP_TTF", "sans-serif"]
size_px = 16
line_height = 1.65

[typography.mono]
families = ["D2Coding ligature", "monospace"]
size_px = 14
line_height = 1.45

