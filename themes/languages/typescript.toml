# TypeScript 전용 구문색. 활성화한 키만 common.toml의 값을 덮어쓴다.
# 값에는 lbrx.toml의 라이트·다크 roles 이름을 사용한다.
[tokens]
# number = "link" # 예시: TypeScript 숫자 리터럴을 링크색으로 표시.
type = "syntax_type" # 타입 선언·타입 인자·원시 타입.
function = "function" # 일반 함수와 TSX 값 기반 컴포넌트.
"keyword.declaration" = "syntax_declaration" # 선언·TSX 내장 태그.
"string.escape" = "syntax_escape" # 템플릿 리터럴의 보간 경계.
attribute = "syntax_attribute" # JSX 속성명.
