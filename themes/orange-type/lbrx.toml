# LBRX 공통 원본: 글꼴, 모드별 색상 팔레트, 색상 역할, 터미널 ANSI 슬롯.
# 파스텔 살구 배경과 오렌지 강조, 보색 스카이 블루를 조합한다. ANSI·오류·성공의 의미색은 유지한다.
# roles와 ansi의 값은 같은 모드의 palette 키를 참조한다.
# 팔레트 또는 역할 키를 추가할 때는 라이트·다크 양쪽에 둔다.
schema_version = 1 # 원본 형식 버전. 현재는 1만 지원.

[typography.prose] # 본문용 글꼴
families = ["LINE Seed Sans", "LINE Seed Sans KR", "LINE Seed JP_TTF", "sans-serif"] # 왼쪽부터 글리프 폴백, 마지막은 일반 글꼴 계열.
size_px = 16 # 본문 글자 크기(px).
line_height = 1.65 # 본문 줄 높이. 글자 크기에 곱하는 배율(단위 없음).

[typography.mono] # 코드·고정폭 글꼴
families = ["D2Coding ligature", "monospace"] # 코드 글꼴 우선순위. 마지막은 일반 고정폭 계열.
size_px = 14 # 코드 글자 크기(px). 일부 앱은 다른 단위로 변환.
line_height = 1.45 # 코드 줄 높이. 글자 크기에 곱하는 배율(단위 없음).

[light.palette] # 라이트 실제 색상. 각 값은 #RRGGBB 문자열.
paper = "#FFF8F0" # 밝고 부드러운 피치 크림 배경.
ink = "#38291F" # 본문용 짙은 웜 브라운.
orange = "#A84B16" # 생기 있는 오렌지 글자색. 파스텔 배경에서 읽을 대비 확보.
pine = "#356548" # 성공 상태와 ANSI 초록의 의미색. UI 오렌지 강조와 분리.
muted = "#6D5A4B" # 보조 글자·주석의 웜 그레이.
slate = "#245E8A" # 함수명의 보색 블루.
plum = "#344F85" # 키워드·인라인 코드의 짙은 블루. 기존 키 이름은 참조 호환용으로 유지.
ochre = "#795814" # 숫자·경고의 황토색.
clay = "#A13D32" # 오류의 적갈색.
surface = "#FFEAD6" # 패널·코드 블록의 파스텔 살구 배경.
syntax_declaration = "#244D78" # 선언 키워드의 딥 블루.
syntax_escape = "#934916" # 문자열 내부 특수 구문의 오렌지 갈색.
syntax_builtin = "#85472B" # 내장 리터럴의 테라코타.
syntax_macro = "#3D4E82" # 매크로의 인디고 블루.
syntax_type = "#2B5D78" # 자료형의 저채도 블루.
syntax_parameter = "#4C5681" # 매개변수의 회청색.
syntax_property = "#365E7A" # 속성·키의 청회색.
syntax_operator = "#63594F" # 연산자의 웜 그레이.
syntax_attribute = "#775524" # 메타정보의 오렌지 황토색.
syntax_punctuation = "#6E6259" # 구분 기호의 웜 그레이.
selection = "#E0EDFC" # 코드·UI 선택의 파스텔 스카이 블루 배경.
prose_selection = "#FFE0BE" # 문서 본문 선택의 밝은 살구 배경.
ansi_black = "#2B211B" # 일반 ANSI 검정.
ansi_cyan = "#286674" # 일반 ANSI 시안.
ansi_magenta = "#805074" # 일반 ANSI 마젠타. 블루 키워드색과 분리.
ansi_white = "#65584D" # ANSI 7 전경. 라이트 배경에서 읽히는 웜 그레이.
ansi_bright_black = "#7A695B" # 밝은 ANSI 검정.
ansi_bright_red = "#B44C3B" # ANSI 9 빨강. 기본 배경 대비 4.5:1 이상.
ansi_bright_green = "#39734D" # ANSI 10 초록. 기본 배경 대비 4.5:1 이상.
ansi_bright_yellow = "#876419" # ANSI 11 노랑. 라이트에서는 황토색으로 대비 확보.
ansi_bright_blue = "#3274A5" # ANSI 12 파랑. 기본 배경 대비 4.5:1 이상.
ansi_bright_magenta = "#8F5E85" # ANSI 13 마젠타. 기본 배경 대비 4.5:1 이상.
ansi_bright_cyan = "#307889" # ANSI 14 시안. 기본 배경 대비 4.5:1 이상.
ansi_bright_white = "#51453B" # ANSI 15 전경. 라이트 배경에서 읽히는 짙은 웜 그레이.

[light.roles] # 라이트의 용도별 색상. 오른쪽은 light.palette 키.
background = "paper" # 문서·편집기의 기본 배경.
code_block_background = "surface" # Typora·Obsidian의 여러 줄 코드 블록 바탕. 인라인 코드와 편집기 전체 배경은 제외.
surface = "surface" # 패널·사이드바 등의 보조 배경.
text = "ink" # 본문·편집기의 기본 글자색.
accent = "orange" # 앱 UI의 오렌지 강조색.
muted = "muted" # 보조 텍스트·줄 번호 등에 쓰는 색.
focus = "orange" # 포커스 경계의 오렌지 강조색.
selection_text = "ink" # 선택 영역 안의 글자색.
selection_background = "selection" # 선택 영역의 배경색.
prose_selection_background = "prose_selection" # Typora·Obsidian 일반 본문 선택 배경. 코드 선택에는 적용하지 않음.
heading = "ink" # 문서 제목·헤딩 색.
link = "orange" # 링크의 오렌지 글자색.
quote = "muted" # 인용문 글자색.
inline_code = "plum" # 문단 안 인라인 코드 글자색.
comment = "muted" # 코드 주석의 기본 역할색.
string = "orange" # 문자열 리터럴의 오렌지 역할색.
keyword = "plum" # 언어 키워드의 기본 역할색.
function = "slate" # 함수명 토큰의 기본 역할색.
number = "ochre" # 숫자 리터럴의 기본 역할색.
syntax_declaration = "syntax_declaration" # 선언 키워드.
syntax_escape = "syntax_escape" # 이스케이프·보간 경계.
syntax_builtin = "syntax_builtin" # 내장 리터럴.
syntax_macro = "syntax_macro" # 매크로·특수 호출.
syntax_type = "syntax_type" # 자료형.
syntax_parameter = "syntax_parameter" # 매개변수.
syntax_property = "syntax_property" # 속성·키.
syntax_operator = "syntax_operator" # 연산자.
syntax_attribute = "syntax_attribute" # 어노테이션·속성명.
syntax_punctuation = "syntax_punctuation" # 구분 기호.
error = "clay" # 오류 상태 및 오류 토큰에 사용할 색.
warning = "ochre" # 경고 상태·진단에 사용할 색.
success = "pine" # 성공 상태에 사용할 색.
terminal_foreground = "ink" # 터미널의 기본 글자색.
terminal_background = "paper" # 터미널의 기본 배경색.
terminal_cursor = "orange" # 터미널 커서의 오렌지색.

[light.ansi] # 라이트 터미널의 필수 ANSI 16색. 오른쪽은 light.palette 키.
0 = "ansi_black" # 일반 검정.
1 = "clay" # 일반 빨강.
2 = "pine" # 일반 초록.
3 = "ochre" # 일반 노랑.
4 = "slate" # 일반 파랑.
5 = "ansi_magenta" # 일반 마젠타.
6 = "ansi_cyan" # 일반 시안.
7 = "ansi_white" # 일반 흰색.
8 = "ansi_bright_black" # 밝은 검정.
9 = "ansi_bright_red" # 밝은 빨강.
10 = "ansi_bright_green" # 밝은 초록.
11 = "ansi_bright_yellow" # 밝은 노랑.
12 = "ansi_bright_blue" # 밝은 파랑.
13 = "ansi_bright_magenta" # 밝은 마젠타.
14 = "ansi_bright_cyan" # 밝은 시안.
15 = "ansi_bright_white" # 밝은 흰색.

[dark.palette] # 다크 실제 색상. 각 값은 #RRGGBB 문자열.
