ink = "#F4E6D8" # 본문용 밝은 크림색.
orange = "#FFC695" # 강조·링크·문자열의 발랄한 파스텔 오렌지.
pine = "#9BCBAA" # 성공 상태와 ANSI 초록의 의미색. UI 오렌지 강조와 분리.
muted = "#C0AC9B" # 보조 글자·주석의 밝은 웜 그레이.
