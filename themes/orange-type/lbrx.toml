plum = "#ADC1F1" # 키워드·인라인 코드의 밝은 블루. 기존 키 이름은 참조 호환용으로 유지.
ochre = "#E2C080" # 숫자·경고의 밝은 황토색.
clay = "#F2A294" # 오류의 밝은 적갈색.
surface = "#38313A" # 패널·코드 블록의 부드러운 웜 차콜 배경.
syntax_declaration = "#9BBFF0" # 선언 키워드의 밝은 딥 블루.
syntax_escape = "#FFC08B" # 문자열 내부 특수 구문의 밝은 오렌지.
syntax_builtin = "#E9AE88" # 내장 리터럴의 밝은 테라코타.
syntax_macro = "#B8C5F5" # 매크로의 밝은 인디고 블루.
syntax_type = "#97C8E0" # 자료형의 밝은 저채도 블루.
syntax_parameter = "#BDC7EA" # 매개변수의 밝은 회청색.
syntax_property = "#A5C9E5" # 속성·키의 밝은 청회색.
syntax_operator = "#C4B5A5" # 연산자의 밝은 웜 그레이.
syntax_attribute = "#E5C38E" # 메타정보의 밝은 오렌지 황토색.
syntax_punctuation = "#B2A396" # 구분 기호의 밝은 웜 그레이.
selection = "#3C4A61" # 코드·UI 선택의 차분한 블루 그레이 배경.
prose_selection = "#62452F" # 문서 본문 선택의 부드러운 살구 브라운 배경.
ansi_black = "#A18E80" # ANSI 0 전경. 다크 배경에서 읽히는 웜 그레이.
ansi_cyan = "#8CCCD8" # 일반 ANSI 시안.
ansi_magenta = "#D5A6CD" # 일반 ANSI 마젠타. 블루 키워드색과 분리.
ansi_white = "#E5D6C7" # 일반 ANSI 흰색.
ansi_bright_black = "#AF9C8D" # ANSI 8 전경. 다크 배경 대비 4.5:1 이상인 웜 그레이.
ansi_bright_red = "#FFC0AF" # 밝은 ANSI 빨강.
ansi_bright_green = "#B8E6C6" # 밝은 ANSI 초록.
ansi_bright_yellow = "#F6D99B" # 밝은 ANSI 노랑.
ansi_bright_blue = "#B3DDFF" # 밝은 ANSI 파랑.
ansi_bright_magenta = "#ECC6E4" # 밝은 ANSI 마젠타.
ansi_bright_cyan = "#B5EBF3" # 밝은 ANSI 시안.
ansi_bright_white = "#FFF7EE" # 밝은 ANSI 흰색.

